<script data-purpose="ui-interactivity">
    // Marquee logic is handled by CSS animation for performance
    // Adding subtle interaction feedback
    document.addEventListener('DOMContentLoaded', () => {
      const circle = document.querySelector('.about-circle');
      if(circle) {
        circle.addEventListener('mousemove', (e) => {
          const rect = circle.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          circle.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px) scale(1.02)`;
        });
        circle.addEventListener('mouseleave', () => {
          circle.style.transform = `translate(0, 0) scale(1)`;
        });
      }
    });
  </script>
