<style>

    /* Smooth marquee pause */
    .marquee-container:hover .animate-marquee {

    }
    /* Mobile menu animation */
    #mobile-menu {
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #mobile-menu.hidden {
      display: none;
      opacity: 0;
      visibility: hidden;
    }
    #mobile-menu:not(.hidden) {
      display: flex;
      opacity: 1;
      visibility: visible;
    }

<script data-purpose="ui-interactivity">
    document.addEventListener('DOMContentLoaded', () => {
      // Circle Hover Effect
      const circle = document.querySelector('.about-circle');
      if(circle && window.innerWidth > 768) {
        circle.addEventListener('mousemove', (e) => {
          const rect = circle.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          circle.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px) scale(1.02)`;
        });
        circle.addEventListener('mouseleave', () => {
          circle.style.transform = `translate(0, 0) scale(1)`;
        });
      }

      // Mobile Menu Logic
      const menuToggle = document.getElementById('menu-toggle');
      const menuClose = document.getElementById('menu-close');
      const mobileMenu = document.getElementById('mobile-menu');
      const mobileLinks = document.querySelectorAll('.mobile-link');

      const toggleMenu = () => {
        mobileMenu.classList.toggle('hidden');
        document.body.classList.toggle('overflow-hidden');
      };

      if(menuToggle && menuClose) {
        menuToggle.addEventListener('click', toggleMenu);
        menuClose.addEventListener('click', toggleMenu);
      }

      mobileLinks.forEach(link => {
        link.addEventListener('click', toggleMenu);
      });
    });
  </script>
